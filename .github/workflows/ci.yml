name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w core
      - run: npm run test -w core
      - run: npm run lint -w core
      - run: npm run test -w proxy

  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w ui

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [core, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Build debug APK
        working-directory: ui/android
        run: ./gradlew assembleDebug -PbundleInDebug=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-wallet-debug-apk
          path: ui/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
